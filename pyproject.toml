[project]
name = "sslamanager"
version = "0.1.5"
description = ""
authors = [
    {name = "Louis Cailliot",email = "louis.cailliot@thalesgroup.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.6,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "lxml>=6.1.0,<7.0.0",
    "sqlalchemy>=2.0.39,<3.0.0",
    "xsdata>=24.12,<26.3",
]

[dependency-groups]
dev = [
    "pytest",
    "coverage",
    "xsdata[cli]"
]

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at ./sslamanager, not ./src/sslamanager.
# All files inside the module directory (including parser/templates) are packaged.
module-name = "sslamanager"
module-root = ""
